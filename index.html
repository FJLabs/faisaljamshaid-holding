<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faisal Jamshaid</title>
<meta name="description" content="faisaljamshaid.com is being rebuilt. Thank you for your patience.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap">
<style>
  :root { --ink: #15131f; --bone: #f1f1ec; --mute: #6f6d7b; --lime: #c9f03c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f1f1ec; --bone: #15131f; --mute: #9b99a6; } }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 24px;
    background: var(--bone); color: var(--ink);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  main { transform: translateY(-4vh); }
  .name { font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -0.03em; margin: 0 0 18px; }
  .name::after { content: ""; display: inline-block; width: .3em; height: .3em; background: var(--lime); margin-left: .18em; vertical-align: baseline; }
  p { font-size: clamp(1rem, 2.4vw, 1.2rem); line-height: 1.5; color: var(--mute); max-width: 32ch; margin: 0 auto; }
  footer { position: fixed; left: 0; right: 0; bottom: 20px; font-size: .85rem; color: var(--mute); }
  footer a { color: inherit; text-underline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1 class="name">faisaljamshaid.com</h1>
    <p>This website is being rebuilt.<br>Thank you for your patience.</p>
  </main>
  <footer>In the meantime: <a href="https://newsletter.faisaljamshaid.com">Zone 6 Health, my weekly newsletter</a></footer>
</body>
</html>
